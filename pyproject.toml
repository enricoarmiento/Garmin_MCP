[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmin-readonly-mcp"
version = "0.1.0"
description = "Local, read-only Garmin Connect MCP server"
requires-python = ">=3.12"
dependencies = [
    "garminconnect==0.3.15",
    "json5>=0.12,<1",
    "mcp>=1.30,<2",
    "ruamel-yaml>=0.18,<0.19",
    "tomlkit>=0.13,<1",
]

[project.scripts]
garmin-mcp = "garmin_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
